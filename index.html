  <meta charset="UTF-8" />

    /* 
      SIMPLE CLEAN PORTFOLIO STYLE
      You can edit colors, fonts, spacing, and image sizes below.
    */

    :root {
      --background: #faf8f4;
      --text: #222222;
      --muted-text: #666666;
      --accent: #b58b6a;
      --card-background: #ffffff;
      --border: #e6e0d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* Header / Navigation */

    header {
      padding: 28px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .site-name {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 22px;
      font-size: 0.95rem;
    }

    nav a {
      color: var(--muted-text);
    }

    nav a:hover {
      color: var(--text);
    }

    /* Main layout */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    section {
      margin-bottom: 90px;
    }

      margin-bottom: 80px;

    }
